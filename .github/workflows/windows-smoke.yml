name: windows-smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run exported unit tests (companion_core, windows_package — must pass)
        shell: pwsh
        run: python -m unittest tests.test_companion_core tests.test_windows_package -v

      - name: Run test_webui — expect FAIL, os.chmod 0600 has no effect on NTFS
        shell: pwsh
        continue-on-error: true
        run: python -m unittest tests.test_webui -v

      - name: Run test_mac_app — expected-skip on win32, Mac-only Box 3, no darwin guard in source
        shell: pwsh
        continue-on-error: true
        run: python -m unittest tests.test_mac_app -v

      - name: Stage fake Steam install + APPDATA exchange dir
        shell: pwsh
        run: |
          $appdata = "$env:RUNNER_TEMP\appdata"
          New-Item -ItemType Directory -Force -Path "$appdata\The Creative Assembly\Warhammer3\scripts" | Out-Null
          $steam = "${env:ProgramFiles(x86)}\Steam"
          New-Item -ItemType Directory -Force -Path "$steam\steamapps" | Out-Null
          $buildId = python -c "import json; print(json.load(open('vanilla.lock.json'))['game_build_id'])"
          $acfLines = '"AppState"', '{', '    "appid"        "1142710"', "    ""buildid""        ""$buildId""", '}'
          Set-Content -Path "$steam\steamapps\appmanifest_1142710.acf" -Value $acfLines -Encoding ascii
          New-Item -ItemType File -Force -Path "$steam\steamapps\libraryfolders.vdf" | Out-Null
          "APPDATA=$appdata" >> $env:GITHUB_ENV

      - name: Start companion, wait for webui.json, GET/POST smoke (one step)
        shell: pwsh
        run: |
          # Combined into one step: a GH Actions Windows runner has been seen killing a
          # Start-Process child at the step boundary (companion.log had one clean line and
          # the process was gone by the next step, with no traceback in either log — an
          # external kill, not a Python-side crash). Keeping spawn+wait+GET+POST in a
          # single pwsh host process avoids that boundary entirely.
          New-Item -ItemType Directory -Force -Path "$env:APPDATA\Alfred" | Out-Null
          # daemon/paths.py's data_dir() only points at %APPDATA%\Alfred when
          # alfred.companion.json marks this as a packaged install (written by
          # build_windows_package.sh/build_macos_app.sh at release time, not present in a
          # bare checkout) — write the same marker so the daemon started straight from the
          # repo behaves like the shipped package instead of falling back to .cache\.
          Set-Content -Path alfred.companion.json -Value '{"schema_version":1,"preset":"vanilla","platform":"windows"}'
          New-Item -ItemType Directory -Force -Path .cache | Out-Null
          Set-Content -Path .cache\profile -Value 'vanilla' -NoNewline
          $log = "$env:APPDATA\companion.log"
          $p = Start-Process -FilePath python -ArgumentList "-X","utf8=0","-u","daemon\aigen.py","--companion" `
              -RedirectStandardOutput $log -RedirectStandardError "$log.err" -PassThru -WindowStyle Hidden
          "COMPANION_PID=$($p.Id)" >> $env:GITHUB_ENV

          $info = "$env:APPDATA\Alfred\webui.json"
          $deadline = (Get-Date).AddSeconds(60)
          while (-not (Test-Path $info) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }

          Write-Host "== Get-Process -Id $($p.Id) =="
          Get-Process -Id $p.Id -ErrorAction SilentlyContinue | Format-List Id,ProcessName,HasExited
          if (-not (Get-Process -Id $p.Id -ErrorAction SilentlyContinue)) { Write-Host "process is NOT running" }

          if (-not (Test-Path $info)) {
            Write-Host "== companion.log =="
            Get-Content "$env:APPDATA\companion.log" -ErrorAction SilentlyContinue
            Write-Host "== companion.log.err =="
            Get-Content "$env:APPDATA\companion.log.err" -ErrorAction SilentlyContinue
            throw "webui.json never appeared within 60s"
          }
          $data = Get-Content $info -Raw | ConvertFrom-Json
          "WEBUI_PORT=$($data.port)" >> $env:GITHUB_ENV
          Write-Host "== netstat -ano | findstr :$($data.port) =="
          netstat -ano | findstr ":$($data.port)"

          $resp = Invoke-WebRequest "http://127.0.0.1:$($data.port)/" -UseBasicParsing
          if ($resp.StatusCode -ne 200) { throw "GET / returned $($resp.StatusCode)" }
          Write-Host $resp.Content

          $resp2 = Invoke-WebRequest "http://127.0.0.1:$($data.port)/setup" -Method POST `
              -Body @{ provider = "gemini"; model = "x" } -SkipHttpErrorCheck -UseBasicParsing
          if ($resp2.StatusCode -ne 403) { throw "POST /setup without token returned $($resp2.StatusCode)" }

      - name: Print companion log tail (must be plain words, not a traceback)
        if: always()
        shell: pwsh
        run: |
          Write-Host "== companion.log tail =="
          Get-Content "$env:APPDATA\companion.log" -Tail 40 -ErrorAction SilentlyContinue
          Write-Host "== companion.log.err tail =="
          Get-Content "$env:APPDATA\companion.log.err" -Tail 40 -ErrorAction SilentlyContinue

      - name: Stop companion
        if: always()
        shell: pwsh
        run: |
          if ($env:COMPANION_PID) { Stop-Process -Id $env:COMPANION_PID -Force -ErrorAction SilentlyContinue }

      - name: Stage a Windows package layout for the launcher smoke
        shell: pwsh
        run: |
          $pkg = "$env:RUNNER_TEMP\Alfred"
          New-Item -ItemType Directory -Force -Path "$pkg\daemon" | Out-Null
          Copy-Item app\windows\*.py,app\windows\*.vbs $pkg
          Copy-Item daemon\*.py "$pkg\daemon"
          Copy-Item vanilla.lock.json $pkg
          # Same packaged-install marker as the companion-boot step above — without it the
          # daemon started by the launcher writes webui.json under $pkg\.cache instead of
          # %APPDATA%\Alfred, and the launcher's own wait_for_webui() polls the latter.
          Set-Content -Path "$pkg\alfred.companion.json" -Value '{"schema_version":1,"preset":"vanilla","platform":"windows"}'
          New-Item -ItemType Directory -Force -Path "$pkg\.cache" | Out-Null
          Set-Content -Path "$pkg\.cache\profile" -Value 'vanilla' -NoNewline
          # No pythonw.exe ships in this repo (it's embedded at release build time) — use the
          # runner's own python.exe under that name, same idiom alfred_launcher.py expects.
          $pyexe = (Get-Command python).Source
          Copy-Item $pyexe "$pkg\pythonw.exe"
          "PKG=$pkg" >> $env:GITHUB_ENV

      - name: Launcher start smoke
        shell: pwsh
        run: |
          $appdata2 = "$env:RUNNER_TEMP\appdata2"
          New-Item -ItemType Directory -Force -Path $appdata2 | Out-Null
          $env:APPDATA = $appdata2
          Push-Location $env:PKG
          python alfred_launcher.py
          Pop-Location
          $startupVbs = "$appdata2\Microsoft\Windows\Start Menu\Programs\Startup\Alfred.vbs"
          if (-not (Test-Path $startupVbs)) { throw "Startup .vbs missing after launch" }
          $pidFile = "$appdata2\Alfred\daemon\aigen.pid"
          if (-not (Test-Path $pidFile)) { throw "pid file missing after launch" }
          # Re-read the pid fresh from the file the launcher wrote (not a variable carried
          # from an earlier step) and check it with Get-Process, not tasklist: MEASURED on
          # windows-latest CI (run 35158297011) that tasklist's own WMI-backed snapshot can
          # report a live pid as absent within ~0.5s of Get-Process -Id finding it running
          # (companion.log 0 bytes, webui.json present, msedge opened by the launcher) — a
          # false negative in the check, not a companion crash.
          $launchedPid = Get-Content $pidFile
          $proc = Get-Process -Id $launchedPid -ErrorAction SilentlyContinue
          if (-not $proc -or $proc.ProcessName -notmatch "python") {
              throw "Get-Process does not show python for pid $launchedPid"
          }
          if (-not (Test-Path "$appdata2\Alfred\webui.json")) { throw "webui.json missing after launcher start" }
          "APPDATA2=$appdata2" >> $env:GITHUB_ENV
          "LAUNCHED_PID=$launchedPid" >> $env:GITHUB_ENV

      - name: Launcher stop smoke
        shell: pwsh
        run: |
          $env:APPDATA = $env:APPDATA2
          Push-Location $env:PKG
          python alfred_launcher.py --stop
          Pop-Location
          $startupVbs = "$env:APPDATA2\Microsoft\Windows\Start Menu\Programs\Startup\Alfred.vbs"
          if (Test-Path $startupVbs) { throw "Startup .vbs still present after --stop" }
          if (Test-Path "$env:APPDATA2\Alfred\daemon\aigen.pid") { throw "pid file still present after --stop" }
          Start-Sleep -Seconds 2
          $stillRunning = Get-Process -Id $env:LAUNCHED_PID -ErrorAction SilentlyContinue
          if ($stillRunning) { throw "process $env:LAUNCHED_PID still running after --stop" }

      - name: Collect logs for upload
        if: always()
        shell: pwsh
        run: |
          # upload-artifact resolves paths under one least-common-ancestor root — the runner's
          # scattered temp dirs (APPDATA, APPDATA2) don't share one, so copy into the workspace.
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "$env:APPDATA\companion.log" artifacts\companion.log -ErrorAction SilentlyContinue
          Copy-Item "$env:APPDATA\companion.log.err" artifacts\companion.log.err -ErrorAction SilentlyContinue
          Copy-Item "$env:APPDATA2\Alfred\launcher.log" artifacts\launcher.log -ErrorAction SilentlyContinue

      - name: Upload companion + launcher logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-logs
          path: artifacts
          if-no-files-found: ignore
